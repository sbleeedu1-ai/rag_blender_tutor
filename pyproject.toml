[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blender-tutor"
version = "0.1.0"
description = "Blender 첫걸음 도우미: Blender 5.2 설명서를 근거로 쉬운 한국어로 안내한다"
requires-python = ">=3.12"
dependencies = [
    "PyYAML>=6.0",
    "beautifulsoup4>=4.12",
    "numpy>=2.0",
    "rank-bm25>=0.2.2",
    "PySide6-Essentials>=6.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]
# 검색 비교(티켓 40)의 로컬 BGE-M3. PyTorch를 함께 받아 무거우므로 따로 설치한다
compare = [
    "sentence-transformers>=3.0",
]

[tool.setuptools]
packages = ["blender_tutor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
