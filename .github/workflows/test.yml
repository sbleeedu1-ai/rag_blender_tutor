# PR을 열거나 main에 올릴 때 GitHub 서버에서 테스트를 돌린다.
# 실제로 쓰는 곳이 Windows라 Windows에서 돌린다. API 키·Blender·data/ 없이 도는 테스트만 있다.
name: 테스트

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 설치
        run: python -m pip install -e ".[dev]"
      - name: 테스트
        run: python -m pytest
