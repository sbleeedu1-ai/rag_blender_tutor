# 공통 준비: 모든 연습 과정이 맨 앞에서 함께 하는 단계.
# 각 연습 과정 파일이 "먼저 할 것: _common.yaml"로 가리킨다.
# 글은 우리 말로 새로 쓰고, 설명서는 소제목 주소로만 가리킨다.
이름표: common
이름: 공통 준비
구간:
  - 이름: 화면 익히기
    단계:
      - 이름표: view-navigate
        이름: 화면 돌리고 당기고 옮겨 보기
        목표 모양: 가운데 정육면체를 위·옆·아래에서, 가까이와 멀리서 마음대로 볼 수 있다.
        쉬운 설명: >-
          물체를 만들기 전에 보는 방향부터 익힌다.
          마우스 가운데 버튼(휠을 누르는 것)으로 화면을 돌리고, 휠을 굴려 당기거나 밀고, Shift와 함께 끌어 옆으로 옮긴다.
          길을 잃으면 Home 키로 장면 전체를 다시 화면에 담는다.
        조작:
          - 설명: 화면 돌리기
            메뉴: View > Navigation > Orbit
            단축키: 가운데 버튼 누른 채 끌기
          - 설명: 확대·축소
            메뉴: View > Navigation > Zoom In/Out
            단축키: 휠 굴리기
          - 설명: 화면 옮기기
            메뉴: View > Navigation > Pan
            단축키: Shift + 가운데 버튼 끌기
          - 설명: 장면 전체를 다시 화면에 담기
            메뉴: View > Frame All
            단축키: Home
        먼저 볼 소제목:
          - editors/3dview/navigate/navigation.html#orbit
          - editors/3dview/navigate/navigation.html#zoom-in-out
          - editors/3dview/navigate/navigation.html#pan
        자주 막히는 곳:
          - 노트북 터치패드처럼 가운데 버튼이 없으면 환경 설정의 Input > Mouse에서 Emulate 3 Button Mouse를 켜고 Alt + 왼쪽 버튼으로 돌린다.

  - 이름: 화면 언어 확인
    단계:
      - 이름표: interface-language
        이름: 화면 언어 확인하기
        목표 모양: 지금 Blender 메뉴가 한국어인지 영어인지 알고 있다.
        쉬운 설명: >-
          도우미는 화면 언어에 맞춰 메뉴 이름을 알려 준다.
          한국어 화면이면 한국어 이름 뒤에 영어를 괄호로 붙이고, 영어 화면이면 영어로만 말한다.
          어느 쪽이든 괜찮으니 바꾸지 않아도 되고, 지금 어떤 언어인지만 확인한다.
        조작:
          - 설명: 환경 설정 창 열기
            메뉴: Edit > Preferences
            단축키: 없음
          - 설명: Interface 쪽에서 언어와 메뉴 번역 켜짐 확인
            메뉴: Edit > Preferences > Interface > Language
            단축키: 없음
        먼저 볼 소제목:
          - editors/preferences/interface.html#language
