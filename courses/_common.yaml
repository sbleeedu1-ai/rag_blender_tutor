# 공통 준비: 모든 연습 과정이 맨 앞에서 함께 하는 단계. 화면 언어 확인 단계는 도우미가 언어를 스스로 알아서 뺐다(티켓 36 검수, 2026-11-03).
# 각 연습 과정 파일이 "먼저 할 것: _common.yaml"로 가리킨다.
# 글은 우리 말로 새로 쓰고, 설명서는 소제목 주소로만 가리킨다.
# 화면에 보이는 메뉴·버튼 이름은 [[Edit > Preferences]]처럼 감싼다. 도우미가 한국어 화면이면 "편집(Edit) > 환경 설정(Preferences)"으로 바꿔 보인다(티켓 32).
이름표: common
이름: 공통 준비
한 줄 설명: 만들기 전에 화면을 돌리고 당기고 옮기는 법을 익힌다.
난이도: 없음
구간:
  - 이름: 화면 익히기
    단계:
      - 이름표: view-navigate
        이름: 화면 돌리고 당기고 옮겨 보기
        목표 모양: 가운데 정육면체를 위·옆·아래에서, 가까이와 멀리서 마음대로 볼 수 있다.
        쉬운 설명: >-
          물체를 만들기 전에 보는 방향부터 익힌다.
          마우스 가운데 버튼(휠을 누르는 것)으로 화면을 돌리고, 휠을 굴려 당기거나 밀고, Shift와 함께 끌어 옆으로 옮긴다.
          길을 잃으면 물체를 고른 채 숫자패드 .(점)을 눌러 그 물체를 화면 가운데로 맞춘다([[View > Frame Selected]]).
          Home([[View > Frame All]])은 카메라·조명까지 장면 전체를 담아서 물체가 가운데 오지 않을 수 있다.
        조작:
          - 설명: 화면 돌리기
            메뉴: View > Navigation > Orbit
            단축키: 가운데 버튼 누른 채 끌기
            안내: "먼저 화면 보는 법부터 익혀 볼게요. 화면 다루기를 이미 아시면 위쪽 '단계 ▼'에서 2단계를 골라 바로 넘어가도 돼요. 마우스 가운데 버튼(휠)을 누른 채 끌어서 정육면체를 이리저리 돌려 보세요."
            감지:
              - 화면: 돌림
          - 설명: 확대
            메뉴: View > Navigation > Zoom In
            단축키: 휠 앞으로 굴리기
            안내: "잘하셨어요. 이번엔 휠을 앞으로 굴려 정육면체를 가까이 당겨 보세요."
            감지:
              - 화면: 확대
          - 설명: 축소
            메뉴: View > Navigation > Zoom Out
            단축키: 휠 뒤로 굴리기
            안내: "이제 휠을 뒤로 굴려 멀리 밀어 보세요."
            감지:
              - 화면: 축소
          - 설명: 화면 옮기기
            메뉴: View > Navigation > Pan
            단축키: Shift + 가운데 버튼 끌기
            안내: "Shift를 누른 채 가운데 버튼으로 끌면 화면이 옆으로 옮겨져요. 한번 해 보시겠어요?"
            감지:
              - 화면: 옮김
          - 설명: 고른 물체를 화면 가운데로 맞추기
            메뉴: View > Frame Selected
            단축키: 숫자패드 .
            안내: "길을 잃었을 때 돌아오는 법이에요. 정육면체를 고른 채 숫자패드의 .(점)을 눌러 보세요. 정육면체가 화면 가운데로 와요. 숫자패드가 없으면 3D 화면 위쪽 [[View]] 메뉴에서 [[Frame Selected]] 항목을 눌러도 돼요.\n\nHome을 누르면 카메라·조명까지 장면 전체가 화면에 들어와요. 만드는 물체만 크게 보려면 숫자패드 .(점)을 써요."
            감지:
              - 화면: 전체
        먼저 볼 소제목:
          - editors/3dview/navigate/navigation.html#orbit
          - editors/3dview/navigate/navigation.html#pan
          - editors/3dview/navigate/navigation.html#frame-selected
        자주 막히는 곳:
          - 노트북 터치패드처럼 가운데 버튼이 없으면 맨 위 [[Edit > Preferences]] 창의 [[Input]]에서 [[Emulate 3 Button Mouse]] 칸을 켜고 Alt + 왼쪽 버튼으로 돌린다.
          - Home을 눌렀는데 만드는 물체가 가운데 오지 않는다. Home은 카메라·조명까지 모두 담기 때문이다. 물체를 고르고 숫자패드 .(점)을 누른다.
