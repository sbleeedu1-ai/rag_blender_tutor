# 검 연습 과정. AI 초안을 사용자가 Blender 5.2에서 따라 하며 고쳤다(티켓 32 검수, 2026-11-02).
# 빠른 설정 창을 닫은 뒤의 기본 장면에서 시작해, 기본 정육면체를 칼날로 쓰고 glTF 파일로 내보내며 끝난다.
# 글은 우리 말로 새로 쓰고, 설명서는 소제목 주소로만 가리킨다. 치수는 비율 위주의 참고값이다.
# 조작마다 '안내'는 도우미가 대화에 하나씩 띄우는 말이고 '감지'는 그 조작을 했다고 볼 조건이다(티켓 27).
# 화면에 보이는 메뉴·버튼 이름은 [[Scale]]처럼 감싼다. 도우미가 한국어 화면이면 "스케일(Scale)"로 바꿔 보인다(티켓 32).
# 감지의 조작 이름(mesh.loopcut_slide 등)은 티켓 32 검수에서 사람이 직접 한 조작으로 잡히는 것을 확인했다.
# 크기 바꾸기·옮기기는 조작 이름(transform.resize·translate)에 방향이 없어 '배율·위치 늘어남/줄어듦/바뀜'으로 방향을 본다
# (옆 패널에서 숫자로 고친 것도 잡힘). 얼마나(끝까지 붙였나)는 보지 않는다.
이름표: sword
이름: 단순한 검
한 줄 설명: 기본 정육면체를 늘려 칼날을 만들고, 코등이·손잡이·끝장식을 붙여 색을 입힌 뒤 게임용 파일로 내보낸다.
난이도: 쉬움
마지막 결과: sword.glb
비슷한 말: [칼, 장검, 단검, 대검, 검, 무기, sword, blade]
먼저 할 것: _common.yaml
구간:
  - 이름: 칼날 만들기
    단계:
      - 이름표: blade-stretch
        이름: 정육면체를 늘려 칼날 모양 잡기
        목표 모양: 정육면체가 위아래로 길고, 옆으로 좁고, 앞뒤로 얇은 판이 되었다.
        참고 치수: 폭은 길이의 7분의 1쯤, 두께는 폭의 3분의 1쯤. 가장 긴 쪽이 두 번째로 긴 쪽의 3배는 넘게.
        쉬운 설명: >-
          장면 가운데 있는 정육면체를 그대로 칼날의 재료로 쓴다.
          정육면체를 고른 채 S를 누르고 X나 Y를 이어 누르면 그 방향으로만 크기가 바뀌어, 폭과 두께를 따로 줄일 수 있다.
          숫자를 바로 쳐서 배수를 넣어도 되고, N으로 여는 [[Sidebar]]의 [[Dimensions]] 칸에서 고쳐도 된다(X가 폭, Y가 두께, Z가 길이).
        조작:
          - 설명: 정육면체 고르기
            메뉴: 없음
            단축키: 왼쪽 버튼 클릭
            안내: "이제 검을 만들어 볼게요. 화면 가운데 있는 정육면체를 칼날 재료로 쓸 거예요. 정육면체를 마우스 왼쪽 버튼으로 눌러 골라 보시겠어요? 처음부터 주황 테두리로 골라져 있으면 그대로 두셔도 돼요."
          - 설명: 위아래로 길게 늘이기(S 다음 Z를 누르면 그 방향으로만)
            메뉴: Object > Transform > Scale
            단축키: S
            안내: "좋아요. 정육면체를 고른 채 S를 누르고 이어서 Z를 눌러 보세요. 위아래로만 늘어나요. 마우스를 움직여 길쭉하게 만든 뒤 왼쪽 버튼으로 확정해요. 다른 방향까지 늘어났으면 Ctrl + Z로 되돌리고 다시 해 보세요."
            감지:
              - 배율 늘어남: Z
              - 배율 그대로: [X, Y]
          - 설명: 폭 줄이기(S 다음 X)
            메뉴: Object > Transform > Scale
            단축키: S
            안내: "이번엔 S 다음 X를 눌러 폭을 좁혀 보세요. 칼날답게 길이보다 한참 좁게요. 다른 방향까지 바뀌었으면 Ctrl + Z로 되돌려요."
            감지:
              - 배율 줄어듦: X
              - 배율 그대로: [Y, Z]
          - 설명: 두께 줄이기(S 다음 Y)
            메뉴: Object > Transform > Scale
            단축키: S
            안내: "같은 방법으로 S 다음 Y를 누르면 앞뒤 두께가 얇아져요. 폭보다 더 얇은 판이 되게 줄여 보세요. 다른 방향까지 바뀌었으면 Ctrl + Z로 되돌려요."
            감지:
              - 배율 줄어듦: Y
              - 배율 그대로: [X, Z]
          - 설명: 옆 패널에서 치수 직접 보기·고치기
            메뉴: View > Sidebar
            단축키: N
            안내: "N을 누르면 오른쪽에 [[Sidebar]]가 열려요. [[Dimensions]] 칸의 X가 폭, Y가 두께, Z가 길이예요. 마음에 안 들면 숫자를 직접 고쳐도 돼요."
        먼저 볼 소제목:
          - scene_layout/object/editing/transform/scale.html#scale
          - scene_layout/object/editing/transform/control/axis_locking.html#axis-locking
          - scene_layout/object/properties/transforms.html#transform
        자주 막히는 곳:
          - 옆 패널에 길이·폭·두께라는 글자가 없고 X·Y·Z만 보인다. X가 폭, Y가 두께, Z가 길이다.
        # 옆 패널(N)에서 치수를 고치면 조작 기록이 남지 않아, 방금 조작과 묶지 않고 비율만 본다.
        끝난 조건:
          - 크기 비율: 3

      - 이름표: blade-tip
        이름: 칼끝 뾰족하게 모으기
        목표 모양: 칼날 맨 위가 한 점으로 모여 뾰족하고, 그 아래는 곧은 판 그대로다.
        참고 치수: 뾰족해지는 부분은 칼날 길이의 5분의 1쯤.
        쉬운 설명: >-
          [[Edit Mode]]로 들어가 칼날 위쪽 가까이에 가로 고리를 하나 더 넣어, 뾰족해질 부분과 곧은 부분을 나눈다.
          고리는 마우스를 올린 모서리를 가로지르는 방향으로 생기므로, 칼날의 긴 세로 모서리 위에서 Ctrl + R을 눌러야 칼날을 가로로 두른다.
          3을 눌러 [[Face]] 고르기로 바꾸고 맨 위 뚜껑 면 하나를 누르면 그 면의 꼭짓점 네 개만 골라진다.
          M에서 [[At Center]]를 고르면 네 점이 한 점으로 모여 칼끝이 된다.
        조작:
          - 설명: 편집 모드로 들어가기(헤더 왼쪽 모드 칸에서 골라도 됨)
            메뉴: 없음
            단축키: Tab
            안내: "이제 칼끝을 뾰족하게 만들어 볼게요. 칼날을 고른 채 Tab을 눌러 [[Edit Mode]]로 들어가 보세요."
            감지:
              - 모드: EDIT_MESH
          - 설명: 가로 고리 넣고 위로 밀기
            메뉴: Edge > Loop Cut and Slide
            단축키: Ctrl + R
            안내: "칼날의 긴 세로 모서리 위에 마우스를 올리고 Ctrl + R을 누르면 칼날을 가로로 두르는 노란 고리가 보여요. 고리가 세로로 보이면 마우스를 긴 세로 모서리 쪽으로 옮겨 보세요. 왼쪽 버튼으로 한 번 누른 뒤 마우스를 위로 움직여 고리를 칼끝 가까이 밀고, 다시 왼쪽 버튼으로 확정해요."
            감지:
              - 방금 조작: mesh.loopcut_slide
          - 설명: 맨 위 뚜껑 면 고르기(3으로 면 고르기 방식)
            메뉴: 없음
            단축키: "3"
            안내: "키보드 위쪽 숫자 3을 눌러 [[Face]]를 고르는 방식으로 바꾼 뒤, 칼날 맨 위 뚜껑 면을 왼쪽 버튼으로 눌러 보세요. 그 면의 꼭짓점 네 개만 골라져요. 맨 위가 잘 안 보이면 가운데 버튼으로 화면을 돌려 위에서 보세요."
          - 설명: 고른 꼭짓점을 가운데 한 점으로 모으기
            메뉴: Mesh > Merge > At Center
            단축키: M
            안내: "M을 누르면 [[Merge]] 메뉴가 떠요. [[At Center]]를 고르면 뚜껑 면의 네 점이 가운데 한 점으로 모여 칼끝이 돼요."
            감지:
              - 방금 조작: mesh.merge
        먼저 볼 소제목:
          - modeling/meshes/editing/edge/loopcut_slide.html#loop-cut-and-slide
          - modeling/meshes/selecting/introduction.html#selection-modes
          - modeling/meshes/editing/mesh/merge.html#merge
        자주 막히는 곳:
          - 고리가 칼날을 따라 세로로 생긴다. 마우스가 짧은 가로 모서리 위에 있어서다. 긴 세로 모서리 위로 옮긴 뒤 Ctrl + R을 누른다.
          - 칼날 전체가 길쭉한 뿔이 된다. 고리의 꼭짓점까지 함께 모았거나 고리가 없어서다. Ctrl + Z로 되돌리고 맨 위 뚜껑 면 하나만 골라 다시 모은다.
          - Ctrl + Z를 너무 많이 눌렀으면 Ctrl + Shift + Z로 한 단계씩 다시 앞으로 간다.
        끝난 조건:
          - 모드: EDIT_MESH
          - 방금 조작: mesh.merge

  - 이름: 손잡이 쪽 부품 붙이기
    단계:
      - 이름표: guard-add
        이름: 코등이 붙이기
        목표 모양: 칼날 아래 끝에 칼날과 직각으로 가로놓인 납작한 막대가 있다.
        참고 치수: 코등이 길이는 칼날 폭의 3-4배, 두께는 칼날 두께의 2배쯤.
        쉬운 설명: >-
          코등이는 칼날과 손잡이 사이를 막는 가로 막대다.
          먼저 Tab으로 [[Object Mode]]로 돌아온 다음 새 정육면체를 더하고, 앞뒤와 위아래만 줄여 납작한 막대로 만든다.
          G 다음 Z를 누르면 위아래로만 움직이니, 칼날 아래 끝까지 내려 붙인다.
        조작:
          - 설명: 물체 모드로 돌아오기(헤더 왼쪽 모드 칸에서 골라도 됨)
            메뉴: 없음
            단축키: Tab
            안내: "이번엔 칼날 아래에 코등이를 붙일게요. 먼저 Tab을 눌러 [[Object Mode]]로 돌아와 주세요."
            감지:
              - 모드: OBJECT
          - 설명: 새 정육면체 더하기
            메뉴: Add > Mesh > Cube
            단축키: Shift + A
            안내: "Shift + A를 누르고 [[Mesh > Cube]]를 골라 새 정육면체를 더해 보세요. 칼날 속에 묻혀 안 보여도 괜찮아요."
            감지:
              - 물체 수 늘어남: 1
          - 설명: 앞뒤·위아래만 줄이기(S 다음 Y, S 다음 Z)
            메뉴: Object > Transform > Scale
            단축키: S
            안내: "새 정육면체를 S 다음 Y로 앞뒤를, S 다음 Z로 위아래를 줄여 옆으로 긴 납작한 막대로 만들어 보세요. 좌우(X)는 그대로 둬요. S만 눌러 전체가 함께 줄었으면 Ctrl + Z로 되돌려요."
            감지:
              - 배율 줄어듦: [Y, Z]
              - 배율 그대로: X
          - 설명: 옮기기(이어서 Z를 누르면 위아래로만)
            메뉴: Object > Transform > Move
            단축키: G
            안내: "G 다음 Z를 누르면 위아래로만 움직여요. 막대를 칼날 아래 끝까지 내려 붙여 보세요."
            감지:
              - 위치 줄어듦: Z
        먼저 볼 소제목:
          - modeling/meshes/primitives.html#cube
          - scene_layout/object/editing/transform/move.html#move
          - scene_layout/object/editing/transform/control/axis_locking.html#axis-locking
        자주 막히는 곳:
          - S만 누르고 줄이면 세 방향이 함께 줄어 작은 정육면체가 된다. Ctrl + Z로 되돌리고 S 다음 Y, S 다음 Z로 하나씩 줄인다.
        끝난 조건:
          - 물체 수 늘어남: 1

      - 이름표: grip-add
        이름: 손잡이 붙이기
        목표 모양: 코등이 바로 아래에 둥근 막대 모양 손잡이가 세로로 이어져 있다.
        참고 치수: 손잡이 길이는 칼날 길이의 4분의 1쯤, 굵기는 칼날 폭보다 조금 가늘게.
        쉬운 설명: >-
          손잡이는 원기둥으로 만든다.
          원기둥을 더한 뒤 크기를 줄여 가늘고 길게 만들고, 코등이 바로 아래로 옮겨 붙인다.
          새 물체는 3D 커서 자리(처음에는 장면 가운데)에 생기므로, 칼날 속에 묻혀 보이지 않아도 놀라지 말고 옮기면 된다.
          칼날과 코등이를 옮겨 두었다면 손잡이는 위로 올려야 할 수도 있다.
        조작:
          - 설명: 새 원기둥 더하기
            메뉴: Add > Mesh > Cylinder
            단축키: Shift + A
            안내: "다음은 손잡이예요. Shift + A에서 [[Mesh > Cylinder]]를 골라 원기둥을 더해 보세요."
            감지:
              - 물체 수 늘어남: 1
          - 설명: 크기 바꾸기
            메뉴: Object > Transform > Scale
            단축키: S
            안내: "S로 원기둥을 가늘게 줄이고, S 다음 Z로 길이를 맞춰 보세요."
            감지:
              - 배율 줄어듦: [X, Y]
          - 설명: 옮기기
            메뉴: Object > Transform > Move
            단축키: G
            안내: "G 다음 Z로 원기둥을 위아래로 옮겨 코등이 바로 아래에 붙여 보세요. 숫자패드 1이나 3으로 옆에서 보면 맞추기 쉬워요."
            감지:
              - 위치 바뀜: Z
        먼저 볼 소제목:
          - modeling/meshes/primitives.html#cylinder
          - scene_layout/object/editing/transform/scale.html#scale
        자주 막히는 곳:
          - 칼날·코등이를 위로 옮겨 두었으면 손잡이도 아래가 아니라 위로 옮겨야 코등이 밑에 붙는다. 숫자패드 1이나 3으로 옆에서 보며 맞춘다.
        끝난 조건:
          - 물체 수 늘어남: 1

      - 이름표: pommel-add
        이름: 끝장식 붙이기
        목표 모양: 손잡이 맨 아래에 작은 공이 달려 있다.
        참고 치수: 공 지름은 손잡이 굵기의 1.5-2배쯤.
        쉬운 설명: >-
          끝장식은 손잡이 끝을 마무리하는 작은 공이다.
          UV 구를 더하고 작게 줄인 뒤 손잡이 아래 끝으로 옮긴다.
          옆에서 볼 때(숫자패드 1이나 3) 위아래 위치를 맞추기 쉽다.
        조작:
          - 설명: 새 UV 구 더하기
            메뉴: Add > Mesh > UV Sphere
            단축키: Shift + A
            안내: "손잡이 끝에 작은 공을 달아 마무리할게요. Shift + A에서 [[Mesh > UV Sphere]]를 골라 보세요."
            감지:
              - 물체 수 늘어남: 1
          - 설명: 크기 바꾸기
            메뉴: Object > Transform > Scale
            단축키: S
            안내: "S를 눌러 공을 손잡이보다 조금 굵은 크기로 줄여 보세요."
            감지:
              - 배율 줄어듦: [X, Y, Z]
          - 설명: 옮기기
            메뉴: Object > Transform > Move
            단축키: G
            안내: "G 다음 Z로 공을 위아래로 옮겨 손잡이 맨 아래에 붙여 보세요. 숫자패드 1이나 3으로 옆에서 보면 맞추기 쉬워요."
            감지:
              - 위치 바뀜: Z
        먼저 볼 소제목:
          - modeling/meshes/primitives.html#uv-sphere
          - scene_layout/object/editing/transform/move.html#move
        자주 막히는 곳:
          - 앞 부품을 옮겨 두었으면 공도 위로 옮겨야 할 수 있다. 옆에서 보며 손잡이 맨 아래에 맞춘다.
        끝난 조건:
          - 물체 수 늘어남: 1

  - 이름: 한 물체로 다듬기
    단계:
      - 이름표: join-parts
        이름: 부품을 한 물체로 합치기
        목표 모양: 칼날·코등이·손잡이·끝장식이 한 물체가 되어, 하나를 누르면 모두 함께 골라진다.
        쉬운 설명: >-
          지금은 부품 네 개가 따로따로라서 하나씩 움직인다.
          A로 모두 고른 다음 Ctrl + J로 합치면 한 물체가 된다. 카메라·조명도 함께 골라지지만 합쳐지지는 않는다.
          합친 뒤 검을 클릭해 보아 검 전체가 함께 골라지면 된 것이다.
        조작:
          - 설명: 모두 고르기
            메뉴: Select > All
            단축키: A
            안내: "지금은 부품 네 개가 따로따로예요. 3D 화면에 마우스를 두고 A를 눌러 모두 골라 보세요. 카메라·조명도 함께 골라지지만 괜찮아요."
            감지:
              - 방금 조작: object.select_all
          - 설명: 고른 물체를 하나로 합치기
            메뉴: Object > Join
            단축키: Ctrl + J
            안내: "모두 고른 채 Ctrl + J를 누르면 한 물체로 합쳐져요. 합친 뒤 검 한 군데를 눌러 검 전체가 주황 테두리로 함께 골라지는지 보세요."
            감지:
              - 방금 조작: object.join
        먼저 볼 소제목:
          - scene_layout/object/editing/join.html#join
        자주 막히는 곳:
          - A를 누르면 카메라·조명까지 골라진다. 그대로 Ctrl + J를 해도 메시만 합쳐지고 카메라·조명은 따로 남는다.
        끝난 조건:
          - 방금 조작: object.join

      - 이름표: apply-scale
        이름: 크기 확정하기
        목표 모양: 겉모습은 그대로인데, 옆 패널의 Scale 칸이 세 방향 모두 1이다.
        쉬운 설명: >-
          늘리고 줄인 배율이 물체에 숫자로 남아 있으면, 다음 단계의 모서리 다듬기가 방향마다 고르지 않게 나올 수 있다.
          검이 골라진 채로 Ctrl + A에서 [[Scale]]을 고르면 지금 모양은 그대로 두고 배율만 1로 되돌린다.
          N [[Sidebar]]에서 [[Scale]]이 1, 1, 1인지 확인한다.
        조작:
          - 설명: 배율을 모양에 굳히기
            메뉴: Object > Apply > Scale
            단축키: Ctrl + A
            안내: "검을 눌러 주황 테두리로 골라진 채 Ctrl + A를 누르고 [[Scale]]을 골라 보세요. 모양은 그대로인데 [[Sidebar]]의 [[Scale]] 칸이 1, 1, 1로 돌아와요. 아무것도 안 바뀌면 검이 골라져 있지 않은 거예요."
            감지:
              - 방금 조작: object.transform_apply
        먼저 볼 소제목:
          - scene_layout/object/editing/apply.html#transforms
        자주 막히는 곳:
          - Ctrl + A를 해도 Scale이 1로 바뀌지 않는다. 빈 곳을 눌러 고른 것이 풀려서다. 검을 눌러 고른 뒤 다시 한다.
        끝난 조건:
          - 방금 조작: object.transform_apply
          - 배율: [1, 1, 1]

      - 이름표: bevel-edges
        이름: 모서리 둥글게 다듬기
        목표 모양: 모서리가 칼처럼 날카롭게 각진 대신 살짝 깎여 빛이 부드럽게 맺힌다.
        참고 치수: 깎는 폭은 칼날 두께의 3분의 1 이하로 작게.
        쉬운 설명: >-
          모디파이어는 원래 모양을 건드리지 않고 그 위에 효과를 얹는 장치다.
          화면 오른쪽 아래 [[Properties]] 창의 파란 렌치 모양 탭에서 [[Bevel]]을 더하면 모든 모서리가 조금씩 깎인다.
          [[Amount]] 값을 작게 줄여 칼날이 뭉툭해지지 않게 한다.
        조작:
          - 설명: Bevel 모디파이어 더하기
            메뉴: Properties > Modifiers > Add Modifier > Generate > Bevel
            단축키: 없음
            안내: "화면 오른쪽 아래, 아이콘 탭이 세로로 늘어선 창이 [[Properties]] 창이에요. 파란 렌치 모양 탭을 열고 [[Add Modifier > Generate > Bevel]] 순서로 골라 보세요. 모서리가 살짝 깎여요."
            감지:
              - 모디파이어: BEVEL
          - 설명: 깎는 폭 줄이기
            메뉴: Properties > Modifiers > Bevel > Amount
            단축키: 없음
            안내: "[[Bevel]]의 [[Amount]] 값을 작게 줄여 칼날이 뭉툭해지지 않게 해 주세요."
        먼저 볼 소제목:
          - modeling/modifiers/introduction.html#interface
          - modeling/modifiers/generate/bevel.html#bevel-modifier
        자주 막히는 곳:
          - 어디가 [[Properties]] 창인지 못 찾는다. 화면 오른쪽 아래, 아이콘 탭이 세로로 늘어선 창이다. 렌치(모디파이어)·빨간 공(머티리얼) 탭이 여기 있다.
        끝난 조건:
          - 모디파이어: BEVEL

  - 이름: 색 입히고 내보내기
    단계:
      - 이름표: color-parts
        이름: 칼날과 손잡이에 다른 색 입히기
        목표 모양: 칼날·코등이·끝장식은 쇠처럼 회색이고, 손잡이만 갈색이다.
        쉬운 설명: >-
          한 물체에 여러 색을 주려면 [[Material]] 칸을 두 개 두고, 면마다 어느 칸을 쓸지 정한다.
          [[Properties]] 창의 [[Material]] 탭(빨간 공 모양)에서 첫 칸(기본 정육면체에 처음부터 있던 것, 비어 있을 때만 [[New]])을 회색으로 하고, 칸을 하나 더해 [[New]] 버튼으로 갈색을 만든다.
          칼날·코등이·끝장식은 따로 정하지 않아도 첫 칸 색을 쓴다.
          기본 화면(솔리드)에서는 색이 보이지 않으므로 Z에서 [[Material Preview]]로 바꿔 본다.
          [[Edit Mode]]에서 손잡이 면 하나를 클릭하고 Ctrl + L로 손잡이 전체를 고른 다음, 갈색 칸을 고른 채 [[Assign]]을 누른다.
        조작:
          - 설명: 재질 탭 열기(첫 칸이 비어 있을 때만 새로 만들기)
            메뉴: Properties > Material > New
            단축키: 없음
            안내: "이제 색을 입힐게요. 화면 오른쪽 아래 [[Properties]] 창에서 빨간 공 모양의 [[Material]] 탭을 열어 보세요. 목록 첫 칸에 이미 이름이 있으면 그대로 쓰고, 비어 있을 때만 [[New]] 버튼을 눌러요."
          - 설명: 재질 칸 하나 더하기
            메뉴: Properties > Material > Material Slots > Add Material Slot
            단축키: 없음
            안내: "목록 오른쪽의 + 버튼을 눌러 칸을 하나 더 만들고, 새 칸에서 [[New]] 버튼을 눌러 [[Material]]을 하나 더 만들어 보세요."
            감지:
              - 방금 조작: object.material_slot_add
          - 설명: 색 고르기
            메뉴: Properties > Material > Surface > Base Color
            단축키: 없음
            안내: "첫 칸을 누른 채 [[Base Color]] 칸을 눌러 쇠처럼 회색을, 둘째 칸을 누른 채 갈색을 골라 보세요. 칼날·코등이·끝장식은 첫 칸 색을 써요."
          - 설명: 색이 보이는 화면으로 바꾸기
            메뉴: View > Viewport Shading > Material Preview
            단축키: Z
            안내: "지금 화면에서는 색이 보이지 않아요. 3D 화면에 마우스를 두고 Z를 누른 뒤 [[Material Preview]]를 골라 보세요. 검이 첫 칸 색으로 보여요."
          - 설명: 편집 모드로 들어가기(헤더 왼쪽 모드 칸에서 골라도 됨)
            메뉴: 없음
            단축키: Tab
            안내: "이제 손잡이만 갈색으로 바꿀게요. Tab을 눌러 [[Edit Mode]]로 들어가 주세요."
            감지:
              - 모드: EDIT_MESH
          - 설명: 고른 면과 이어진 부분 전체 고르기
            메뉴: Select > Select Linked > Linked
            단축키: Ctrl + L
            안내: "숫자 3으로 [[Face]] 고르기 방식으로 바꾼 뒤 손잡이 면 하나를 누르고, Ctrl + L로 손잡이 전체를 골라 보세요."
            감지:
              - 방금 조작: mesh.select_linked
          - 설명: 고른 면에 지금 재질 칸 쓰기
            메뉴: Properties > Material > Assign
            단축키: 없음
            안내: "[[Material]] 목록에서 갈색 칸을 누른 채 그 아래 [[Assign]]을 누르면 손잡이만 갈색이 돼요. [[Assign]] 버튼은 [[Edit Mode]]에서만 보여요."
            감지:
              - 방금 조작: object.material_slot_assign
        먼저 볼 소제목:
          - render/materials/assignment.html#material-slots
          - render/materials/assignment.html#edit-mode
          - editors/3dview/display/shading.html#material-preview
        자주 막히는 곳:
          - 색을 바꿨는데 화면이 회색 그대로다. 기본 화면(솔리드)은 재질 색을 보이지 않아서다. Z를 누르고 [[Material Preview]]를 고른다.
          - 첫 칸에 이미 재질이 있는데 [[New]] 버튼을 또 눌러 칸이 늘었다. 그대로 써도 되고, 첫 칸에 회색을 주면 된다.
        끝난 조건:
          - 재질 슬롯 수: 2
          - 방금 조작: object.material_slot_assign

      - 이름표: export-gltf
        이름: glTF 파일로 내보내기
        목표 모양: 저장한 폴더에 sword.glb 파일 하나가 생겼다.
        쉬운 설명: >-
          glTF는 게임 엔진이 널리 읽는 3D 파일 형식이고, .glb는 그것을 파일 하나로 묶은 것이다.
          Tab으로 [[Object Mode]]로 돌아와 [[File > Export > glTF 2.0 (.glb/.gltf)]] 메뉴로 내보내고, 형식은 파일 하나로 묶는 .glb로 둔다.
          모서리 다듬기가 파일에도 들어가도록 [[Mesh]] 쪽의 [[Apply Modifiers]] 칸을 켜고(꺼져 있으면), 이름을 sword.glb로 저장한다.
        조작:
          - 설명: 물체 모드로 돌아오기(헤더 왼쪽 모드 칸에서 골라도 됨)
            메뉴: 없음
            단축키: Tab
            안내: "거의 다 왔어요! Tab을 눌러 [[Object Mode]]로 돌아와 주세요."
            감지:
              - 모드: OBJECT
          - 설명: glTF로 내보내기 창 열기
            메뉴: File > Export > glTF 2.0 (.glb/.gltf)
            단축키: 없음
            안내: "[[File > Export > glTF 2.0 (.glb/.gltf)]] 메뉴를 눌러 내보내기 창을 열어 보세요. 형식은 파일 하나로 묶는 .glb로 두면 돼요."
          - 설명: 모디파이어를 적용해 내보내기 켜기
            메뉴: Data > Mesh > Apply Modifiers
            단축키: 없음
            안내: "오른쪽 설정의 [[Data]] > [[Mesh]]에서 [[Apply Modifiers]] 칸을 켜고, 파일 이름을 sword.glb로 정해 [[Export]]를 눌러 주세요."
            감지:
              - 방금 조작: export_scene.gltf
        먼저 볼 소제목:
          - addons/scene_gltf2.html#export
          - addons/scene_gltf2.html#gltf-binary-glb
          - addons/scene_gltf2.html#data-mesh
        # glTF 내보내기는 Blender의 조작 기록에 남지 않아, 애드온이 glTF 내보내기 끝 알림(glTF2_post_export_callback)을 받아
        # "방금 실행한 조작"에 export_scene.gltf를 직접 넣는다(티켓 25).
        끝난 조건:
          - 방금 조작: export_scene.gltf
