# 방패 연습 과정. AI 초안(티켓 36, 2026-11-03). 사용자가 Blender 5.2에서 따라 하며 고칠 예정이다(검과 같은 방식의 검수).
# 빠른 설정 창을 닫은 뒤의 기본 장면에서 시작해, 기본 정육면체를 지우고 원기둥으로 둥근 방패를 만들어 glTF 파일로 내보내며 끝난다.
# 검에서 안 해 본 조작(물체 지우기, 안쪽 면 넣기 I, 면 밀어내기 E, 돌리기 R)을 새로 익히게 했다(2026-11-03 사용자 "안해본 조작을 새로 익히게 하는건 좋네").
# 글은 우리 말로 새로 쓰고, 설명서는 소제목 주소로만 가리킨다. 치수는 비율 위주의 참고값이다.
# 조작마다 '안내'는 도우미가 대화에 하나씩 띄우는 말이고 '감지'는 그 조작을 했다고 볼 조건이다(티켓 27).
# 화면에 보이는 메뉴·버튼 이름은 [[Scale]]처럼 감싼다. 도우미가 한국어 화면이면 "스케일(Scale)"로 바꿔 보인다(티켓 32).
# 뒤 손잡이는 토러스를 세워 절반을 판 속에 묻어 컵 손잡이처럼 만들고, 테두리는 Alt + 클릭으로 한 바퀴 골라 쇠색을 입힌다(2026-11-03 사용자 "A 도 넣고 … 컵의 손잡이 처럼 해야하지 않음?").
# 감지의 조작 이름(object.delete·mesh.inset·mesh.loop_select·transform.rotate)과 세운 고리의 S Z(배율 Y 칸)는 검수(2026-11-03) 흐름에서 잡히는 것을 확인했다.
# E(면 밀어내기)는 Python 조작이 안에서 다른 조작을 부르는데, 기록에는 mesh.extrude_region_move로 남는다(같은 흐름에서 확인).
# 안내의 숫자(S Z 0.07, I 0.2, E -0.05, 장식 S 0.25·S Z 0.5·G Z 0.06, 손잡이 S 0.2·S Z 0.4·G Z -0.13)는 한 묶음으로, 차례대로 치면
# 장식이 판 뒤로 나오지 않고 손잡이 위 끝이 판 속에 묻히는 것을 화면 없는 Blender로 확인했다. 앞 숫자를 바꾸면 뒤 숫자도 다시 맞춰야 한다.
# 새 원기둥·UV 구에는 재질 칸이 없어서, 합쳐도 검처럼 빈 재질 칸이 생기지 않는다(2026-11-03 Blender 5.2로 확인).
이름표: shield
이름: 둥근 방패
한 줄 설명: 원기둥을 납작하게 눌러 방패 판을 만들고, 테두리·가운데 장식·뒤 손잡이를 더해 색을 입힌 뒤 세워서 게임용 파일로 내보낸다.
난이도: 쉬움
마지막 결과: shield.glb
비슷한 말: [방패, 원형 방패, 둥근 방패, 버클러, 라운드 실드, 실드, 방어구, shield, buckler]
먼저 할 것: _common.yaml
구간:
  - 이름: 방패 판 만들기
    단계:
      - 이름표: disc-body
        이름: 원기둥을 눌러 둥근 판 만들기
        목표 모양: 장면 가운데에 동전처럼 납작하고 둥근 판 하나만 있다.
        참고 치수: 두께는 지름의 15분의 1쯤.
        쉬운 설명: >-
          방패는 둥근 판이라 정육면체 대신 원기둥으로 시작한다.
          먼저 장면 가운데 정육면체를 골라 지운다. 카메라·조명은 그대로 둔다.
          원기둥을 새로 더한 뒤 S 다음 Z를 눌러 위아래로만 눌러 주면 동전 같은 판이 된다.
          S·G·R을 누른 뒤 마우스 대신 키보드로 숫자를 치면 그 값이 바로 들어간다. S는 지금 크기에 곱하는 배수, G는 옮길 거리, R은 돌릴 각도다.
          판은 지금 바닥에 누워 있고, 위를 보는 면이 방패 앞면이 된다. 마지막에 세운다.
        조작:
          - 설명: 정육면체 고르고 지우기
            메뉴: Object > Delete
            단축키: X 또는 Delete
            안내: "이번엔 방패를 만들어 볼게요. 방패는 둥근 판이라 원기둥으로 시작해요. 먼저 화면 가운데 정육면체를 왼쪽 버튼으로 눌러 고른 뒤, 3D 화면에 마우스를 두고 Delete 키를 눌러 지워 보세요. X를 누르면 작은 메뉴가 뜨는데, 거기서 [[Delete]]를 눌러도 돼요."
            감지:
              - 방금 조작: object.delete
          - 설명: 새 원기둥 더하기
            메뉴: Add > Mesh > Cylinder
            단축키: Shift + A
            안내: "Shift + A를 누르고 [[Mesh > Cylinder]]를 골라 원기둥을 더해 보세요. 정육면체가 있던 자리에 생겨요."
            감지:
              - 물체 수 늘어남: 1
          - 설명: 위아래로만 눌러 납작하게(S 다음 Z)
            메뉴: Object > Transform > Scale
            단축키: S
            안내: "원기둥을 고른 채 S 다음 Z를 누르고, 마우스는 움직이지 말고 키보드로 0.07을 친 뒤 Enter를 눌러 보세요. 지금 높이의 0.07배로 눌려 동전 같은 판이 돼요. 마우스로 움직여 맞춰도 되지만, 마우스로 움직인 뒤에 숫자를 치면 움직인 크기에 다시 곱해지니 둘 중 하나만 써요. 옆으로도 줄었으면 Ctrl + Z로 되돌려요."
            감지:
              - 배율 줄어듦: Z
              - 배율 그대로: [X, Y]
        먼저 볼 소제목:
          - scene_layout/object/editing/delete.html#delete
          - modeling/meshes/primitives.html#cylinder
          - scene_layout/object/editing/transform/control/axis_locking.html#axis-locking
        자주 막히는 곳:
          - X를 눌렀는데 바로 지워지지 않고 작은 메뉴가 뜬다. 정말 지울지 묻는 것이다. [[Delete]]를 누르거나, 처음부터 Delete 키를 쓴다.
          - 정육면체를 지웠는데 카메라나 조명이 사라졌다. 정육면체가 아닌 것이 골라져 있었다. Ctrl + Z로 되돌리고 정육면체를 눌러 고른 뒤 다시 지운다.

      - 이름표: rim-inset
        이름: 테두리 만들기
        목표 모양: 판 앞면 가장자리에 둥근 테두리가 한 단 높게 남고, 그 안쪽이 살짝 들어가 있다.
        참고 치수: 테두리 폭은 지름의 10분의 1쯤, 안쪽이 들어간 깊이는 판 두께의 3분의 1쯤.
        쉬운 설명: >-
          [[Edit Mode]]에서 판의 위쪽 면(앞면) 하나만 고르고 I를 누르면, 그 면 안쪽에 같은 모양의 작은 면이 하나 더 생긴다. 바깥에 남는 고리 모양 띠가 테두리가 된다.
          그 상태로 E를 누르면 안쪽 면을 앞뒤로 밀어낼 수 있다. 조금 아래로 밀면 가운데가 들어가고 테두리가 도드라진다.
        조작:
          - 설명: 편집 모드로 들어가기(헤더 왼쪽 모드 칸에서 골라도 됨)
            메뉴: 없음
            단축키: Tab
            안내: "이제 판에 테두리를 만들 거예요. 판을 고른 채 Tab을 눌러 [[Edit Mode]]로 들어가 보세요."
            감지:
              - 모드: EDIT_MESH
          - 설명: 위쪽 면 하나 고르기(3으로 면 고르기 방식)
            메뉴: 없음
            단축키: "3"
            안내: "키보드 위쪽 숫자 3을 눌러 [[Face]] 고르기 방식으로 바꾸세요. 처음에는 판 전체가 골라져 있으니, 판 위쪽 둥근 면을 왼쪽 버튼으로 한 번 눌러 그 면만 골라 보세요. 위쪽 면이 잘 안 보이면 가운데 버튼으로 화면을 돌려 위에서 보세요."
            # 3을 누르면 면 34개가 골라져 있다가, 윗면을 누르면 1개가 된다(검수 흐름으로 확인)
            감지:
              - 고른 면 수: 1
          - 설명: 안쪽 면 넣기
            메뉴: Face > Inset Faces
            단축키: I
            안내: "3D 화면에 마우스를 두고 I를 누른 뒤, 마우스는 움직이지 말고 키보드로 0.2를 치고 Enter를 눌러 보세요. 고른 면 안쪽에 둥근 선이 하나 더 생기고, 바깥에 남은 띠가 테두리가 돼요."
            감지:
              - 방금 조작: mesh.inset
          - 설명: 안쪽 면을 살짝 아래로 밀기
            메뉴: Mesh > Extrude > Extrude Faces Along Normals
            단축키: E
            안내: "안쪽 면이 골라진 채 E를 누르고, 마우스는 움직이지 말고 키보드로 -0.05를 친 뒤 Enter를 눌러 보세요. 안쪽 면이 조금 아래로 내려가 가운데가 들어가고 테두리가 도드라져요."
            감지:
              - 방금 조작: mesh.extrude_region_move
        먼저 볼 소제목:
          - modeling/meshes/selecting/introduction.html#selection-modes
          - modeling/meshes/editing/face/inset_faces.html#inset-faces
          - modeling/meshes/editing/face/extrude_faces_normal.html#extrude-faces-along-normals
        자주 막히는 곳:
          - I를 눌렀는데 아무것도 안 바뀐다. 마우스가 3D 화면 밖에 있었거나 면이 아니라 판 전체가 골라져 있었다. 위쪽 면 하나만 눌러 고른 뒤 3D 화면 위에서 I를 누른다.
          - I로 생긴 선이 마우스를 따라 바깥으로 커진다. 마우스를 판 가운데 쪽으로 옮겨야 안쪽으로 들어간다.
          - E로 민 면이 위로 솟았다. 숫자 앞의 - 를 빠뜨렸다. Ctrl + Z로 되돌리고 -0.05로 다시 한다.
        끝난 조건:
          - 모드: EDIT_MESH

  - 이름: 장식과 손잡이 붙이기
    단계:
      - 이름표: boss-add
        이름: 가운데 장식 붙이기
        목표 모양: 방패 앞면 한가운데에 납작한 반구 모양 쇠 장식이 볼록 솟아 있다.
        참고 치수: 장식 지름은 판 지름의 4분의 1쯤, 높이는 그 지름의 4분의 1쯤.
        쉬운 설명: >-
          방패 한가운데 볼록한 장식은 UV 구를 작고 납작하게 만들어 붙인다.
          [[Object Mode]]로 돌아와 UV 구를 더하면 판 한가운데에 생긴다. S로 전체를 줄이고, S 다음 Z로 위아래만 더 눌러 납작하게 한다.
          G 다음 Z로 살짝 올려 판 앞면 위로 볼록 솟게 둔다. 아래쪽은 판 속에 묻혀도 괜찮지만, 판 뒷면으로 삐져나오지 않을 만큼은 올린다.
        조작:
          - 설명: 물체 모드로 돌아오기(헤더 왼쪽 모드 칸에서 골라도 됨)
            메뉴: 없음
            단축키: Tab
            안내: "테두리가 생겼어요. 이번엔 가운데 장식을 붙일게요. Tab을 눌러 [[Object Mode]]로 돌아와 주세요."
            감지:
              - 모드: OBJECT
          - 설명: 새 UV 구 더하기
            메뉴: Add > Mesh > UV Sphere
            단축키: Shift + A
            안내: "Shift + A에서 [[Mesh > UV Sphere]]를 골라 공을 더해 보세요. 판 한가운데에 큰 공이 생겨요."
            감지:
              - 물체 수 늘어남: 1
          - 설명: 전체를 줄이기
            메뉴: Object > Transform > Scale
            단축키: S
            안내: "S를 누르고 마우스는 움직이지 말고 키보드로 0.25를 친 뒤 Enter를 눌러 보세요. 공 전체가 4분의 1 크기로 줄어요."
            감지:
              - 배율 줄어듦: [X, Y, Z]
          - 설명: 위아래만 눌러 납작하게(S 다음 Z)
            메뉴: Object > Transform > Scale
            단축키: S
            안내: "S 다음 Z를 누르고 마우스는 움직이지 말고 키보드로 0.5를 친 뒤 Enter를 눌러 보세요. 공이 위아래로만 반쯤 눌려 납작한 만두 모양이 돼요. 옆으로도 줄었으면 Ctrl + Z로 되돌려요."
            감지:
              - 배율 줄어듦: Z
              - 배율 그대로: [X, Y]
          - 설명: 살짝 올리기(G 다음 Z)
            메뉴: Object > Transform > Move
            단축키: G
            안내: "G 다음 Z를 누르고 마우스는 움직이지 말고 키보드로 0.06을 친 뒤 Enter를 눌러 보세요. 장식이 살짝 올라가 판 앞면 위로 볼록 솟고, 아래쪽은 판 속에 묻혀 뒤로 삐져나오지 않아요."
            감지:
              - 위치 늘어남: Z
        먼저 볼 소제목:
          - modeling/meshes/primitives.html#uv-sphere
          - scene_layout/object/editing/transform/scale.html#scale
          - scene_layout/object/editing/transform/move.html#move
        자주 막히는 곳:
          - 공이 보이지 않는다. 판보다 커서 판을 감싸고 있거나, 아직 [[Edit Mode]]라 판 안에 면으로 더해졌다. Ctrl + Z로 되돌리고 Tab으로 [[Object Mode]]인지 본 뒤 다시 더한다.
          - 장식이 판 뒤쪽으로 튀어나왔다. 덜 올렸거나 G 다음 Z에서 아래로 움직였다. 옆에서 보며 위로 더 올린다.
        끝난 조건:
          - 물체 수 늘어남: 1

      - 이름표: handle-add
        이름: 뒤 손잡이 붙이기
        목표 모양: 방패 뒷면 한가운데에 컵 손잡이 같은 반원 고리가 솟아 있다.
        참고 치수: 고리 폭은 판 지름의 4분의 1쯤, 판 뒤로 솟은 높이는 판 두께와 비슷하게.
        쉬운 설명: >-
          손잡이는 도넛 모양의 토러스로 만든다. 토러스를 세워 절반을 판 속에 묻으면, 밖에 남은 절반이 컵 손잡이 같은 고리가 된다.
          토러스는 처음에 바닥에 누운 채 생기므로 R 다음 X로 90도 돌려 세운다.
          S로 작게 줄인 뒤 S 다음 Z로 위아래를 눌러 납작한 고리로 만든다. 그대로 두면 고리가 판보다 높아서, 판 속에 묻은 위쪽이 앞면을 뚫고 나온다.
          G 다음 Z로 내려 고리 위 끝만 판 속에 조금 들어가게 하면, 판 아래로 컵 손잡이 같은 반원이 나온다.
        조작:
          - 설명: 새 토러스 더하기
            메뉴: Add > Mesh > Torus
            단축키: Shift + A
            안내: "이번엔 방패 뒤에 손잡이를 달게요. Shift + A에서 [[Mesh > Torus]]를 골라 도넛 모양을 더해 보세요. 판 한가운데에 크게 누운 채 생겨요."
            감지:
              - 물체 수 늘어남: 1
          - 설명: X축을 중심으로 90도 돌려 세우기
            메뉴: Object > Transform > Rotate
            단축키: R
            안내: "R을 누르고 이어서 X를 누른 뒤, 숫자 90을 치고 Enter를 눌러 보세요. 누워 있던 도넛이 바퀴처럼 일어서요."
            감지:
              - 방금 조작: transform.rotate
          - 설명: 전체를 줄이기
            메뉴: Object > Transform > Scale
            단축키: S
            안내: "S를 누르고 마우스는 움직이지 말고 키보드로 0.2를 친 뒤 Enter를 눌러 보세요. 도넛 전체가 작아져요."
            감지:
              - 배율 줄어듦: [X, Y, Z]
          - 설명: 위아래만 눌러 납작한 고리로(S 다음 Z)
            메뉴: Object > Transform > Scale
            단축키: S
            안내: "S 다음 Z를 누르고 마우스는 움직이지 말고 키보드로 0.4를 친 뒤 Enter를 눌러 보세요. 고리가 위아래로 눌려 납작해져요. 이렇게 해야 판 속에 묻은 쪽이 앞면을 뚫고 나오지 않아요."
            # 고리를 X로 90도 세웠기 때문에, 화면의 위아래(Z)로 누르면 물체 자신의 배율은 Y 칸이 바뀐다(2026-11-03 화면 없는 Blender로 모양 확인, 감지는 검수 때 확인)
            감지:
              - 배율 줄어듦: Y
              - 배율 그대로: [X, Z]
          - 설명: 내려서 절반을 판 속에 묻기(G 다음 Z)
            메뉴: Object > Transform > Move
            단축키: G
            안내: "G 다음 Z를 누르고 마우스는 움직이지 말고 키보드로 -0.13을 친 뒤 Enter를 눌러 보세요. 고리가 내려가 위 끝만 판 속에 묻히고, 판 아래로 반원 고리가 나와요."
            감지:
              - 위치 줄어듦: Z
        먼저 볼 소제목:
          - modeling/meshes/primitives.html#torus
          - scene_layout/object/editing/transform/rotate.html#rotate
          - scene_layout/object/editing/transform/move.html#move
        자주 막히는 곳:
          - R을 누른 뒤 마우스를 움직이면 도넛이 아무렇게나 돈다. X를 눌러 X축으로만 돌게 묶은 뒤 90을 친다.
          - 앞면 쪽으로 고리 끝이 튀어나왔다. 고리를 덜 내렸거나 납작하게 누르지 않아서다. 옆에서 보며 G 다음 Z로 더 내리고, 그래도 나오면 S 다음 Z로 더 누른다.
          - 고리가 판에서 떨어져 떠 있다. 너무 많이 내렸다. 위 끝이 판 속에 조금 들어가게 다시 올린다.
        끝난 조건:
          - 물체 수 늘어남: 1

  - 이름: 한 물체로 다듬기
    단계:
      - 이름표: join-parts
        이름: 판·장식·손잡이를 한 물체로 합치기
        목표 모양: 판·장식·손잡이가 한 물체가 되어, 하나를 누르면 모두 함께 골라진다.
        쉬운 설명: >-
          지금은 판·장식·손잡이 세 부품이 따로따로다.
          A로 모두 고른 다음 Ctrl + J로 합치면 한 물체가 된다. 카메라·조명도 함께 골라지지만 합쳐지지는 않는다.
        조작:
          - 설명: 모두 고르기
            메뉴: Select > All
            단축키: A
            안내: "부품 세 개를 하나로 합칠게요. 3D 화면에 마우스를 두고 A를 눌러 모두 골라 보세요. 카메라·조명도 함께 골라지지만 괜찮아요."
            감지:
              - 방금 조작: object.select_all
          - 설명: 고른 물체를 하나로 합치기
            메뉴: Object > Join
            단축키: Ctrl + J
            안내: "모두 고른 채 Ctrl + J를 누르면 한 물체로 합쳐져요. 합친 뒤 방패 한 군데를 눌러 부품 셋이 함께 주황 테두리로 골라지는지 보세요."
            감지:
              - 방금 조작: object.join
        먼저 볼 소제목:
          - scene_layout/object/editing/join.html#join
        자주 막히는 곳:
          - A를 누르면 카메라·조명까지 골라진다. 그대로 Ctrl + J를 해도 메시만 합쳐지고 카메라·조명은 따로 남는다.
        끝난 조건:
          - 방금 조작: object.join

      - 이름표: apply-scale
        이름: 크기 확정하기
        목표 모양: 겉모습은 그대로인데, 옆 패널의 Scale 칸이 세 방향 모두 1이다.
        쉬운 설명: >-
          늘리고 줄인 배율이 물체에 숫자로 남아 있으면, 다음 단계의 모서리 다듬기가 방향마다 고르지 않게 나올 수 있다.
          방패가 골라진 채로 Ctrl + A에서 [[Scale]]을 고르면 지금 모양은 그대로 두고 배율만 1로 되돌린다.
          N [[Sidebar]]에서 [[Scale]]이 1, 1, 1인지 확인한다.
        조작:
          - 설명: 배율을 모양에 굳히기
            메뉴: Object > Apply > Scale
            단축키: Ctrl + A
            안내: "늘이고 줄인 배율이 남아 있으면 다음 단계의 모서리 깎기가 방향마다 다르게 나와서, 지금 모양을 기준 크기로 굳혀 둘게요. 방패를 눌러 주황 테두리로 골라진 채 Ctrl + A를 누르고 [[Scale]]을 골라 보세요. 모양은 그대로인데 N으로 여는 [[Sidebar]]의 [[Scale]] 칸이 1, 1, 1로 돌아와요."
            감지:
              - 방금 조작: object.transform_apply
        먼저 볼 소제목:
          - scene_layout/object/editing/apply.html#transforms
        자주 막히는 곳:
          - Ctrl + A를 해도 Scale이 1로 바뀌지 않는다. 빈 곳을 눌러 고른 것이 풀려서다. 방패를 눌러 고른 뒤 다시 한다.
        끝난 조건:
          - 방금 조작: object.transform_apply
          - 배율: [1, 1, 1]

      - 이름표: bevel-edges
        이름: 모서리 둥글게 다듬기
        목표 모양: 판 가장자리와 테두리 모서리가 살짝 깎여 빛이 부드럽게 맺힌다.
        참고 치수: 깎는 폭은 판 두께의 4분의 1 이하로 작게.
        쉬운 설명: >-
          [[Bevel]] 모디파이어로 모서리를 깎는다. 모디파이어는 원래 모양을 건드리지 않고 그 위에 효과를 얹는 장치다.
          [[Properties]] 창의 파란 렌치 모양 탭에서 [[Bevel]]을 더하고 [[Amount]] 값을 작게 줄인다.
          판 옆면처럼 거의 평평하게 이어진 모서리는 깎이지 않고, 테두리처럼 꺾인 모서리만 깎인다.
        조작:
          - 설명: Bevel 모디파이어 더하기
            메뉴: Properties > Modifiers > Add Modifier > Generate > Bevel
            단축키: 없음
            안내: "이번엔 모서리를 살짝 깎아 다듬을게요. 화면 오른쪽 아래 [[Properties]] 창에서 파란 렌치 모양 탭을 열고 [[Add Modifier > Generate > Bevel]] 순서로 골라 보세요."
            감지:
              - 모디파이어: BEVEL
          - 설명: 깎는 폭 줄이기
            메뉴: Properties > Modifiers > Bevel > Amount
            단축키: 없음
            안내: "[[Bevel]]의 [[Amount]] 칸에 0.02를 넣어 보세요. 판 가장자리와 테두리 모서리만 살짝 깎여서, 크게 달라 보이지 않는 게 맞아요."
          # 시험용(티켓 36 검수 14번): 사용자가 다시 검수 때 해 보고 남길지 정한다
          - 설명: 깎은 면을 여러 겹으로 나눠 둥글게
            메뉴: Properties > Modifiers > Bevel > Segments
            단축키: 없음
            안내: "[[Segments]] 칸을 3으로 올려 보세요. 깎인 모서리가 한 면이 아니라 세 겹으로 나뉘어 더 둥글게 보여요."
        먼저 볼 소제목:
          - modeling/modifiers/generate/bevel.html#bevel-modifier
        자주 막히는 곳:
          - 테두리가 뭉개져 둥근 덩어리처럼 보인다. [[Amount]] 값이 판 두께에 비해 크다. 값을 더 작게 줄인다.
        끝난 조건:
          - 모디파이어: BEVEL

  - 이름: 색 입히고 세워서 내보내기
    단계:
      - 이름표: color-parts
        이름: 판과 쇠 부분에 다른 색 입히기
        목표 모양: 판과 손잡이는 나무처럼 갈색이고, 가운데 장식과 앞면 테두리는 쇠처럼 회색이다.
        쉬운 설명: >-
          한 물체에 여러 색을 주려면 [[Material]] 칸을 두 개 두고, 면마다 어느 칸을 쓸지 정한다.
          원기둥과 UV 구는 처음부터 재질이 없어서, [[Material]] 탭(빨간 공 모양) 목록이 비어 있다. [[New]] 버튼을 누르면 칸과 재질이 함께 생기고 방패 전체가 그 칸을 쓴다.
          + 버튼으로 칸을 하나 더 만들고 [[New]]로 둘째 재질을 만든 뒤, [[Edit Mode]]에서 장식과 테두리를 골라 둘째 칸에 [[Assign]]한다.
          테두리 띠는 면이 한 바퀴 이어져 있어, Alt를 누른 채 띠 위를 클릭하면 한 바퀴가 한 번에 골라진다.
          기본 화면(솔리드)에서는 색이 보이지 않으므로 Z에서 [[Material Preview]]로 바꿔 본다.
        조작:
          - 설명: 첫 재질 만들기
            메뉴: Properties > Material > New
            단축키: 없음
            안내: "이제 색을 입힐게요. 방패가 골라진 채 화면 오른쪽 아래 [[Properties]] 창에서 빨간 공 모양의 [[Material]] 탭을 열어 보세요. 목록이 비어 있을 거예요. [[New]] 버튼을 누르면 첫 재질이 생겨요."
            감지:
              - 재질 슬롯 수: 1
          - 설명: 재질 칸 하나 더하기
            메뉴: Properties > Material > Material Slots > Add Material Slot
            단축키: 없음
            안내: "목록 오른쪽의 + 버튼을 눌러 칸을 하나 더 만들고, 새 칸에서 [[New]] 버튼을 눌러 둘째 재질을 만들어 보세요."
            감지:
              - 재질 슬롯 수: 2
          - 설명: 색 고르기
            메뉴: Properties > Material > Surface > Base Color
            단축키: 없음
            안내: "첫 칸을 누른 채 [[Base Color]] 칸을 눌러 나무 같은 갈색을, 둘째 칸을 누른 채 쇠 같은 회색을 골라 보세요. 장식에 둘째 칸을 쓰기 전까지는 방패 전체가 첫 칸 색이에요."
          - 설명: 색이 보이는 화면으로 바꾸기
            메뉴: View > Viewport Shading > Material Preview
            단축키: Z
            안내: "지금 화면에서는 색이 보이지 않아요. 3D 화면에 마우스를 두고 Z를 누른 뒤 [[Material Preview]]를 골라 보세요. 방패가 첫 칸 색으로 보여요."
          - 설명: 편집 모드로 들어가기(헤더 왼쪽 모드 칸에서 골라도 됨)
            메뉴: 없음
            단축키: Tab
            안내: "이제 장식만 회색으로 바꿀게요. Tab을 눌러 [[Edit Mode]]로 들어가 주세요."
            감지:
              - 모드: EDIT_MESH
          - 설명: 고른 면과 이어진 부분 전체 고르기
            메뉴: Select > Select Linked > Linked
            단축키: Ctrl + L
            안내: "숫자 3으로 [[Face]] 고르기 방식으로 바꾼 뒤 장식 면 하나를 누르고, Ctrl + L로 장식 전체를 골라 보세요."
            감지:
              - 방금 조작: mesh.select_linked
          - 설명: 고른 면에 지금 재질 칸 쓰기
            메뉴: Properties > Material > Assign
            단축키: 없음
            안내: "[[Material]] 목록에서 회색 칸을 누른 채 그 아래 [[Assign]]을 누르면 장식만 회색이 돼요. [[Assign]] 버튼은 [[Edit Mode]]에서만 보여요."
            감지:
              - 방금 조작: object.material_slot_assign
          - 설명: 앞면 테두리 띠 한 바퀴 고르기(Alt + 클릭)
            메뉴: Select > Select Loops > Edge Loops
            단축키: Alt + 왼쪽 버튼 클릭
            안내: "이번엔 앞면 테두리를 회색으로 할게요. Alt를 누른 채 테두리 띠 위를 왼쪽 버튼으로 눌러 보세요. 띠 한가운데쯤, 이웃 면과 나뉘는 짧은 선 가까이를 누르면 띠 한 바퀴가 한 번에 골라져요. 면 두세 개만 골라지면 누른 자리를 조금 옮겨 다시 Alt + 클릭해요."
            감지:
              - 방금 조작: mesh.loop_select
          - 설명: 테두리에 회색 칸 쓰기
            메뉴: Properties > Material > Assign
            단축키: 없음
            안내: "회색 칸이 골라진 채 다시 [[Assign]]을 눌러 보세요. 테두리도 회색이 돼요."
            감지:
              - 방금 조작: object.material_slot_assign
        먼저 볼 소제목:
          - render/materials/assignment.html#material-slots
          - render/materials/assignment.html#edit-mode
          - modeling/meshes/selecting/loops.html#select-face-loops
        자주 막히는 곳:
          - 색을 바꿨는데 화면이 회색 그대로다. 기본 화면(솔리드)은 재질 색을 보이지 않아서다. Z를 누르고 [[Material Preview]]를 고른다.
          - Ctrl + L을 눌렀더니 판까지 골라졌다. 장식이 아니라 판 면을 눌렀다. 빈 곳을 눌러 풀고 장식 면을 눌러 다시 한다.
          - Alt + 클릭했더니 테두리 한 바퀴가 아니라 바깥쪽으로 면 두세 개만 골라졌다. 띠를 가로지르는 방향으로 고른 것이다. 띠 한가운데, 이웃 면과 나뉘는 짧은 선 가까이를 다시 Alt + 클릭한다.
          - 테두리 옆면도 회색으로 하고 싶다. Shift + Alt를 누른 채 옆면 띠를 클릭해 더 고른 뒤 [[Assign]]을 누른다.
        끝난 조건:
          - 재질 슬롯 수: 2
          - 방금 조작: object.material_slot_assign

      - 이름표: stand-up
        이름: 방패 세우기
        목표 모양: 바닥에 누워 있던 방패가 앞면을 앞으로 향하고 똑바로 서 있다.
        쉬운 설명: >-
          지금 방패는 앞면이 위를 보고 누워 있다.
          [[Object Mode]]에서 R 다음 X를 누르고 90을 치면 X축을 중심으로 90도 돌아 앞면이 앞을 본다.
          숫자패드 1을 눌러 앞에서 보면 장식이 가운데 보이는 둥근 방패가 된다.
        조작:
          - 설명: 물체 모드로 돌아오기(헤더 왼쪽 모드 칸에서 골라도 됨)
            메뉴: 없음
            단축키: Tab
            안내: "거의 다 왔어요. 방패를 세울게요. Tab을 눌러 [[Object Mode]]로 돌아와 주세요."
            감지:
              - 모드: OBJECT
          - 설명: X축을 중심으로 90도 돌리기
            메뉴: Object > Transform > Rotate
            단축키: R
            안내: "방패를 고른 채 R을 누르고 이어서 X를 누른 뒤, 숫자 90을 치고 Enter를 눌러 보세요. 방패가 일어서요. 숫자패드 1로 앞에서 보면 장식이 가운데 보여요. 뒷면이 보이면 Ctrl + Z로 되돌리고 -90으로 해 보세요."
            감지:
              - 방금 조작: transform.rotate
        먼저 볼 소제목:
          - scene_layout/object/editing/transform/rotate.html#rotate
          - scene_layout/object/editing/transform/control/axis_locking.html#axis-locking
        자주 막히는 곳:
          - R을 누른 뒤 마우스를 움직이면 방패가 화면을 따라 아무렇게나 돈다. X를 눌러 X축으로만 돌게 묶은 뒤 90을 친다.
        끝난 조건:
          - 방금 조작: transform.rotate

      - 이름표: export-gltf
        이름: glTF 파일로 내보내기
        목표 모양: 저장한 폴더에 shield.glb 파일 하나가 생겼다.
        쉬운 설명: >-
          [[File > Export > glTF 2.0 (.glb/.gltf)]] 메뉴로 내보내고, 형식은 파일 하나로 묶는 .glb로 둔다.
          모서리 다듬기가 파일에도 들어가도록 [[Mesh]] 쪽의 [[Apply Modifiers]] 칸을 켜고(꺼져 있으면), 이름을 shield.glb로 저장한다.
        조작:
          - 설명: glTF로 내보내기 창 열기
            메뉴: File > Export > glTF 2.0 (.glb/.gltf)
            단축키: 없음
            안내: "마지막이에요! [[File > Export > glTF 2.0 (.glb/.gltf)]] 메뉴를 눌러 내보내기 창을 열어 보세요. 형식은 파일 하나로 묶는 .glb로 두면 돼요."
          - 설명: 모디파이어를 적용해 내보내기 켜기
            메뉴: Data > Mesh > Apply Modifiers
            단축키: 없음
            안내: "오른쪽 설정의 [[Data]] > [[Mesh]]에서 [[Apply Modifiers]] 칸을 켜고, 파일 이름을 shield.glb로 정해 [[Export]]를 눌러 주세요."
            감지:
              - 방금 조작: export_scene.gltf
        먼저 볼 소제목:
          - addons/scene_gltf2.html#export
          - addons/scene_gltf2.html#gltf-binary-glb
          - addons/scene_gltf2.html#data-mesh
        # glTF 내보내기는 Blender의 조작 기록에 남지 않아, 애드온이 내보내기 끝 알림을 받아 export_scene.gltf를 직접 넣는다(티켓 25).
        끝난 조건:
          - 방금 조작: export_scene.gltf
